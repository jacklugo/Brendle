<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#f6f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Brendle · Brendan Air Daily">
<meta property="og:description" content="Airports, geography and planes. New flights every day.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="iconbtn" id="homeBtn" aria-label="Home">

  <div class="brand">

    <span class="sub" id="flightNo">Brendan Air</span>
  </div>
  <button class="iconbtn" id="helpBtn" aria-label="How to play">?</button>

<main id="app"></main>

<dialog id="modal">
  <div class="modal-inner">
    <button class="close" id="modalClose" aria-label="Close">×</button>
